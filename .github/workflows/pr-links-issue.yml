# orot-ai 전 저장소 공통: PR 본문에 Closes #번호 또는 Refs #번호가 있어야 통과한다.
# 정본은 orot-ai/.github/workflow-templates. 저장소마다 설치·갱신은
# orot-ai/bayon 900_system/integrations/gh-issue/issue.py workflow --all 이 한다(직접 고치지 않는다).
name: PR 본문 점검
on:
  pull_request:
    types: [opened, edited, reopened]
jobs:
  links-issue:
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Closes/Refs 확인
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='(^|[^A-Za-z])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]:]+(([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/[0-9]+)'
          if printf '%s' "$BODY" | grep -Eiq "$pattern"; then
            echo "이슈 연결 확인"
          else
            echo "::error::PR 본문에 'Closes #번호'(닫을 이슈) 또는 'Refs #번호'(관련만)가 없습니다. 본문을 고치면 다시 확인합니다."
            exit 1
          fi
